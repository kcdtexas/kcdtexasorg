# Netlify build settings for kcdtexas.org. They override the settings in
# Netlify's web UI. When and how production deploys happen: ADRs 0010 and 0011.

[build]
  # Netlify installs the dependencies from package-lock.json first.
  command = "bash scripts/build.sh --skip-install"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  # No dependency's install script runs in a production build, where the program platform's key is set.
  NPM_FLAGS = "--ignore-scripts"
