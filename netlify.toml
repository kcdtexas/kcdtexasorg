# Netlify build settings for kcdtexas.org, kept only for the rollback until
# Netlify is shut down: the site is on Cloudflare Pages (ADR 0012,
# docs/hosting.md). They override the settings in Netlify's web UI.

[build]
  # Netlify installs the dependencies from package-lock.json first.
  command = "bash scripts/build.sh --skip-install"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  # No dependency's install script runs in a production build, where the program platform's key is set.
  NPM_FLAGS = "--ignore-scripts"
