# Short Links on kcdtexas.org (ADR 0002). Owned by the Marketing Committee.
#
# code: 302 while a link may still change target, 301 once its target is final.
#   Every link stays 302 until v1, because browsers cache 301s forever.
# mode: what happens to the link when v1 pages exist:
#   follows-current   points to the Current Edition's page on this site
#   pinned            keeps pointing at a 2026 resource
#   replaced-by-page  becomes a real page on this site at the same path
#   evergreen         keeps its external target across Editions
# Never add a catch-all (/*): unknown paths must show the 404 page.

- { from: /cfp,             to: "/2027/cfp/",                                        code: 302, mode: follows-current }
- { from: /schedule,        to: "/2027/schedule/",                                   code: 302, mode: follows-current }
- { from: /sponsors,        to: "/2027/sponsors/",                                   code: 302, mode: follows-current }
- { from: /sponsor-guide,   to: "https://github.com/kcdtexas/sponsor-guide",         code: 302, mode: follows-current }
- { from: /sponsor-faq,     to: "https://docs.google.com/presentation/d/1Vdvhhe7HbJgzsei4Zw_IEM-BudqrSnzS/edit?usp=sharing&ouid=111136301388613558226&rtpof=true&sd=true", code: 302, mode: follows-current }
- { from: /talks,           to: "https://github.com/kcdtexas/talks",                 code: 302, mode: follows-current }
- { from: /workshops,       to: "https://github.com/kcdtexas/workshop-materials",    code: 302, mode: follows-current }
- { from: /code-of-conduct, to: "https://github.com/kcdtexas/code-of-conduct",       code: 302, mode: replaced-by-page }
- { from: /coc,             to: "/code-of-conduct/",                                 code: 302, mode: follows-current }
- { from: /committees,      to: "https://github.com/kcdtexas/committees",            code: 302, mode: evergreen }
- { from: /github,          to: "https://github.com/kcdtexas",                       code: 302, mode: evergreen }
- { from: /cntx,            to: "https://cloudnativetexas.com",                      code: 302, mode: evergreen }
- { from: /linktree,        to: "https://linktree.com/kcdtexas",                     code: 302, mode: evergreen }
- { from: /youtube,         to: "https://www.youtube.com/@KCDTexas",                 code: 302, mode: evergreen }
- { from: /photos,          to: "https://photos.kcdtexas.org/",                      code: 302, mode: evergreen }
- { from: /present,         to: "https://sessionize.com/kcd-texas-2026",             code: 302, mode: pinned }
- { from: /feedback,        to: "https://forms.gle/RdZ4CULh7qMYMESq8",               code: 302, mode: pinned }
- { from: /komodor,         to: "https://komodor.com/",                              code: 302, mode: pinned }
- { from: /happy-hour,      to: "/happy-hour/happy-hour-banner-web.png",             code: 302, mode: pinned }
