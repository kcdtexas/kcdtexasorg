# Rebuilds the live site on the days its date-driven text changes (docs/rebuilds.md). The pages are static, so
# "Open now", "Closed" and the like only change when a build runs. Every morning this asks
# scripts/rebuild-today.mjs whether today, in Central time, is one of the days scripts/rebuild-dates.mjs lists
# from the Edition file. If it is, it POSTs to the Netlify build hook.
name: Rebuild on date changes

on:
  schedule:
    # 07:17 UTC is 2:17 a.m. CDT or 1:17 a.m. CST; 10:47 UTC is 5:47 or 4:47 a.m. Both fall after midnight Central
    # all year, DST or not, so the run's Central day is today's. The second run is a backup for a dropped or failed
    # first run: it skips the hook when today's first run already rebuilt. tests/rebuild.mjs checks these times.
    - cron: '17 7 * * *'
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild now, even if today isn't a rebuild day (to test the hook)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repo
      actions: read # the backup run looks for today's first run
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      day: ${{ steps.today.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # scripts/rebuild-dates.mjs reads the TypeScript Edition file with the compiler in the dependencies.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: today
        run: node scripts/rebuild-today.mjs
      - id: earlier
        name: Did today's first run rebuild?
        if: github.event_name == 'schedule' && github.event.schedule == '47 10 * * *' && steps.today.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rebuild.yml --event schedule --status success \
            --created "$(date -u +%F)" --json databaseId --jq length)
          echo "Successful scheduled runs today: $n"
          echo "done=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          TODAY: ${{ steps.today.outputs.rebuild }}
          DONE: ${{ steps.earlier.outputs.done }}
        run: |
          if [ "$FORCE" = true ]; then echo "Forced by hand."; r=true
          elif [ "$TODAY" = true ] && [ "$DONE" = true ]; then echo "Today's first run already rebuilt."; r=false
          else r=$TODAY; fi
          echo "rebuild=$r" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The hook is a secret of the production environment, which only main can use (CLAUDE.md).
    environment: production
    permissions: {}
    steps:
      - name: Start a Netlify production build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          DAY: ${{ needs.check.outputs.day }}
        # The hook's address never goes in the log: it isn't echoed, and curl's errors don't print it.
        run: |
          if [ -z "$HOOK" ]; then echo "::error::NETLIFY_BUILD_HOOK isn't set in the production environment."; exit 1; fi
          curl -fsS --retry 3 --retry-all-errors -o /dev/null -X POST -d '{}' "$HOOK?trigger_title=Scheduled+rebuild+$DAY"
          echo "Netlify accepted the build hook for $DAY. The deploy shows in Netlify's Deploys list."

  # GitHub turns off scheduled workflows in a public repo after 60 days without repository activity, and
  # Feb 1 to Apr 23 can pass without a commit. Enabling the workflow through the API restarts that count, so the
  # first run each day does it, with no dummy commit. If GitHub turns it off anyway: docs/rebuilds.md.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # enable this workflow
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/rebuild.yml/enable" --silent
