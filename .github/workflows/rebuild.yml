# Rebuilds the live site on the days its date-driven text changes, and when the public program changes
# (docs/rebuilds.md). The pages are static, so "Open now", "Closed" and the like only change when a build runs.
# Each run asks scripts/rebuild-today.mjs what to do by the refresh policy (scripts/refresh-policy.mjs): rebuild
# on the days scripts/rebuild-dates.mjs lists from the Edition file; while a program gate is open, check the
# platform and rebuild only on a change; otherwise nothing. A rebuild POSTs to the Netlify build hook.
name: Rebuild on date changes

on:
  schedule:
    # 07:17 UTC is 2:17 a.m. CDT or 1:17 a.m. CST; 10:47 UTC is 5:47 or 4:47 a.m. Both fall after midnight Central
    # all year, DST or not, so the run's Central day is today's. The second run is a backup for a dropped or failed
    # first run: it skips the hook when today's first run already rebuilt. tests/rebuild.mjs checks these times.
    - cron: '17 7 * * *'
    - cron: '47 10 * * *'
    # Event Day, Apr 23: every 5 minutes from 7:02 a.m. to 6:57 p.m. CDT (12:02 to 23:57 UTC). GitHub can't read
    # the Edition file, so this names the day; tests/rebuild.mjs checks it against the Edition's event day.
    - cron: '2-59/5 12-23 23 4 *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild now, even if today isn't a rebuild day (to test the hook)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repo
      actions: read # the backup run looks for today's first run
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      program: ${{ steps.today.outputs.check }}
      day: ${{ steps.today.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # scripts/rebuild-dates.mjs reads the TypeScript Edition file with the compiler in the dependencies.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # check=true only while a program gate is open in the checked-out Edition file, on the policy's days and times.
      - id: today
        env:
          CRON: ${{ github.event.schedule }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/rebuild-today.mjs --cron "$CRON" --force "$FORCE"
      - id: earlier
        name: Did today's first run rebuild?
        if: github.event_name == 'schedule' && github.event.schedule == '47 10 * * *' && steps.today.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rebuild.yml --event schedule --status success \
            --created "$(date -u +%F)" --json databaseId --jq length)
          echo "Successful scheduled runs today: $n"
          echo "done=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          TODAY: ${{ steps.today.outputs.rebuild }}
          DONE: ${{ steps.earlier.outputs.done }}
        run: |
          if [ "$TODAY" = true ] && [ "$DONE" = true ]; then echo "Today's first run already rebuilt."; r=false
          else r=$TODAY; fi
          echo "rebuild=$r" >> "$GITHUB_OUTPUT"

  # Has the public program changed on the platform since the live site was built? It runs only when the check job
  # found a gate open, and prints only "changed" or "unchanged": no program data, no artifacts, no caches.
  program:
    needs: check
    if: needs.check.outputs.program == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The platform's address is a secret of the production environment, which only main can use (CLAUDE.md).
    environment: production
    permissions:
      contents: read # check out the repo
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: compare
        name: Has the program changed?
        env:
          SESSIONIZE_ENDPOINT_ID: ${{ secrets.SESSIONIZE_ENDPOINT_ID }}
          PROGRAM_CSV_URL: ${{ secrets.PROGRAM_CSV_URL }}
        run: node scripts/program-check.mjs

  rebuild:
    needs: [check, program]
    # On a rebuild day, or after a check that found a change. The program job is skipped on most runs.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.check.outputs.rebuild == 'true' || needs.program.outputs.changed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The hook is a secret of the production environment, which only main can use (CLAUDE.md).
    environment: production
    permissions: {}
    steps:
      - name: Start a Netlify production build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          DAY: ${{ needs.check.outputs.day }}
          TITLE: ${{ needs.check.outputs.rebuild == 'true' && 'Scheduled+rebuild' || 'Program+change' }}
        # The hook's address never goes in the log: it isn't echoed, and curl's errors don't print it.
        run: |
          if [ -z "$HOOK" ]; then echo "::error::NETLIFY_BUILD_HOOK isn't set in the production environment."; exit 1; fi
          curl -fsS --retry 3 --retry-all-errors -o /dev/null -X POST -d '{}' "$HOOK?trigger_title=$TITLE+$DAY"
          echo "Netlify accepted the build hook for $DAY. The deploy shows in Netlify's Deploys list."

  # GitHub turns off scheduled workflows in a public repo after 60 days without repository activity, and
  # Feb 1 to Apr 23 can pass without a commit. Enabling the workflow through the API restarts that count, so the
  # first run each day does it, with no dummy commit. If GitHub turns it off anyway: docs/rebuilds.md.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # enable this workflow
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/rebuild.yml/enable" --silent
